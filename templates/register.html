{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="register-page">
    <div class="register-box">

        <h2>Create Account</h2>
        <p class="register-subtitle">Create your account to continue</p>

        <form method="POST" action="/register">

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label for="register-password">Password</label>

                <div class="password-field">
                    <input
                        type="password"
                        name="password"
                        id="register-password"
                        required
                    >

                    <span
                        class="password-eye"
                        onclick="toggleRegisterPassword()"
                    >
                        <svg id="register-eye" viewBox="0 0 24 24" fill="none">
                            <path
                                d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                                stroke="currentColor"
                                stroke-width="2"
                            />
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>
</div>

<script>
function toggleRegisterPassword() {
    const password = document.getElementById("register-password");
    const eye = document.getElementById("register-eye");

    if (password.type === "password") {
        password.type = "text";

        eye.innerHTML = `
            <path d="M3 3L21 21"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"/>

            <path d="M10.5 5.2C11 5.1 11.5 5 12 5C18.5 5 22 12 22 12C22 12 20.8 14.4 18.5 16.4"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

            <path d="M6 7.2C3.5 9.2 2 12 2 12C2 12 5.5 19 12 19C13.5 19 14.8 18.7 16 18.2"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        `;
    } else {
        password.type = "password";

        eye.innerHTML = `
            <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

            <circle cx="12" cy="12" r="3"
                    stroke="currentColor"
                    stroke-width="2"/>
        `;
    }
}
</script>

{% endblock %}

{% extends "base.html" %}

{% block title %}Personal Information{% endblock %}

{% block content %}

<div class="profile-page">

    <h2>Personal Information</h2>

    <div class="profile-box">

        <form method="POST">

            <label>Full Name</label>
            <input
                type="text"
                name="name"
                value="{{ user.name }}"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                value="{{ user.email }}"
                required
            >

            <label>Phone Number</label>
            <input
                type="text"
                name="phone"
                value="{{ user.phone or '' }}"
                placeholder="Enter phone number"
            >

            <label>Date of Birth</label>
            <input
                type="date"
                name="date_of_birth"
                value="{{ user.date_of_birth or '' }}"
            >

            <label>Gender</label>
            <select name="gender">
                <option value="">Select Gender</option>

                <option value="Male"
                    {% if user.gender == "Male" %}selected{% endif %}>
                    Male
                </option>

                <option value="Female"
                    {% if user.gender == "Female" %}selected{% endif %}>
                    Female
                </option>

                <option value="Other"
                    {% if user.gender == "Other" %}selected{% endif %}>
                    Other
                </option>
            </select>

            <label>Account Created</label>
            <input
                type="text"
                value="{{ user.created_at }}"
                disabled
            >

            <button type="submit">Save Changes</button>

        </form>

        <a href="/Account">← Back to Account</a>

    </div>

</div>

{% endblock %}
